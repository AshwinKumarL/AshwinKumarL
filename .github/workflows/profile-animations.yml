name: Generate contribution animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: AshwinKumarL
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#C84BFF&color_dots=#16111F,#3A1B4B,#6B1E52,#A42D65,#FF3B5C
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#7B2CBF&color_dots=#EEE7F7,#D9B8F1,#C84BFF,#A42D65,#FF3B5C

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
